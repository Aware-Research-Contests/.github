name: Finding
description: Report a vulnerability. One issue per finding; set its severity label.
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what is wrong and what it allows.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Vulnerability details
      description: The root cause, with links to the affected lines (GitHub permalinks or file and line numbers).
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What an attacker gains or what users lose, and under which conditions.
    validations:
      required: true
  - type: textarea
    id: poc
    attributes:
      label: Proof of concept
      description: A test or step-by-step scenario that demonstrates the issue. Use code blocks for code.
    validations:
      required: false
  - type: textarea
    id: mitigation
    attributes:
      label: Recommended mitigation
      description: How the issue could be fixed.
    validations:
      required: false
